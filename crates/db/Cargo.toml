[package]
name = "wf-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
wf-core = { workspace = true }
sea-orm = { workspace = true }
# Pinned to the same minor SeaORM depends on, so the PgPool type unifies.
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests build Uuids directly; sea-orm's re-export doesn't enable `v4`, so
# without this `cargo test -p wf-db` only compiles via feature unification
# with other workspace crates.
uuid = { version = "1", features = ["v4"] }
# Phase 0 spike harness + GitHub live-validate example.
tokio = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
wf-github = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
