[package]
name = "wf-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wf-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wf-core = { workspace = true }
wf-db = { workspace = true }
wf-http = { workspace = true }
wf-github = { workspace = true }
wf-jira = { workspace = true }
wf-slack = { workspace = true }
wf-sync = { workspace = true }

actix-web = { workspace = true }
actix-cors = { workspace = true }

serde = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

chrono = { workspace = true }
chrono-tz = { workspace = true }
async-openai = { workspace = true }
regex = { workspace = true }
uuid = { version = "1", features = ["v4"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Auth: JWKS fetch + JWT verification (migration plan §7).
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }

# OpenAPI (Phase 5a)
utoipa = { workspace = true, features = ["actix_extras"] }

# OpenTelemetry (spec §12)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
